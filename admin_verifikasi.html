<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Administrasi · Backoffice Nuwo Magang</title>
<meta name="theme-color" content="#0A2A4A">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/bi-logo-bulat.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/portal.css">
<script src="assets/gerak.js"></script>
<style>
  .row-item .seg{flex-shrink:0;}
  .row-item .seg button{min-width:108px;}
  .doc-item{padding:16px 0;border-top:1px solid var(--line);}
  .doc-item:first-of-type{border-top:none;padding-top:4px;}
  .doc-item .top{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .doc-item h4{font-size:14.5px;font-weight:700;}
  .doc-item p{font-size:12.5px;color:var(--ink-2);}
  .doc-item .seg button{min-width:auto;}
  @media(max-width:640px){.row-item{flex-direction:column;}}

  .result{border-radius:var(--radius);padding:20px 22px;}
  .result .kicker{margin-bottom:6px;}
  .result h2{font-size:24px;margin-bottom:6px;}
  .result p{font-size:13.5px;}
  .result.green{background:var(--green-bg);} .result.green .kicker,.result.green h2,.result.green p{color:#1B5E3D;}
  .result.amber{background:var(--amber-bg);} .result.amber .kicker,.result.amber h2,.result.amber p{color:#6E4A00;}
  .result.red{background:var(--red-bg);} .result.red .kicker,.result.red h2,.result.red p{color:#7F1F22;}
  .result.gray{background:#fff;border:1px solid var(--line);} .result.gray h2{color:var(--ink-2);}
  .rules p{font-size:12.5px;color:var(--ink-2);margin-top:8px;}
  .info-list div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;}
  .info-list span{color:var(--ink-2);}
  .info-list b{font-weight:600;text-align:right;}
</style>
</head>
<body data-menu="verifikasi">
<div class="bo">
  <aside class="bo-side" id="sidebar"></aside>
  <main class="bo-main" id="main">
    <button type="button" class="btn btn-outline btn-sm bo-menu-btn" id="menuBtn"><span data-ikon="menu"></span>Menu</button>
    <div class="loading" data-kerangka>Memuat data pelamar…</div>
  </main>
</div>

<script src="assets/ikon.js"></script>
<script src="assets/common.js"></script>
<script src="assets/admin.js"></script>
<script>
  const id = Number(new URLSearchParams(location.search).get('id'));
  const SYARAT = [
    ['s1', 'Jenjang Strata Satu (S1)', a => `Surat pengantar dan KTM menyatakan jenjang S1. Diisi pelamar: ${a.jenjang}.`],
    ['semester', 'Minimal semester 4', a => `Semester yang diisi pelamar: ${a.semester}. Cocokkan dengan surat pengantar.`],
    ['aktif', 'Mahasiswa aktif', () => 'Surat pengantar diterbitkan dan ditandatangani pejabat berwenang.'],
  ];
  const state = { syarat: {}, berkas: {} };
  let app, files, pengaturan;

  (async () => {
    if (!await requireAdmin()) return;
    const data = await api(`backend/api/admin/application.php?id=${id}`);
    if (!data.success) { document.getElementById('main').innerHTML = `<div class="notice red">${esc(data.message)}</div>`; return; }
    ({ application: app, files, pengaturan } = data);
    SYARAT.forEach(([k]) => state.syarat[k] = app[`syarat_${k}`]);
    BERKAS.forEach(b => state.berkas[b.jenis] = files[b.jenis] ? files[b.jenis].status_verifikasi : 'tidak_sesuai');
    render();
  })();

  function seg(group, key, value, options) {
    return `<div class="seg" role="group">${options.map(([v, label, color]) =>
      `<button type="button" data-group="${group}" data-key="${key}" data-value="${v}" class="${value === v ? 'on-' + color : ''}" aria-pressed="${value === v}">${label}</button>`).join('')}</div>`;
  }

  function hasil() {
    const s = Object.values(state.syarat), b = Object.values(state.berkas);
    if (s.includes('tidak') || b.includes('tidak_sesuai')) return 'tidak_memenuhi';
    if (s.includes(null) || s.includes(undefined) || b.includes(null) || b.includes(undefined)) return null;
    if (b.includes('perbaikan')) return 'perbaikan';
    return 'memenuhi';
  }

  function render() {
    const prodi = String(app.fakultas_prodi || '').split('/').pop().trim();
    document.getElementById('main').innerHTML = `
      <button type="button" class="btn btn-outline btn-sm bo-menu-btn" id="menuBtn"><span data-ikon="menu"></span>Menu</button>
      <a href="dashboard_admin.html" class="back-link"><span data-ikon="kembali" data-ikon-ukuran="15"></span>Daftar Pelamar</a>
      <div class="page-head" style="margin-bottom:18px;"><div>
        <h1>Verifikasi Administrasi</h1>
        <div class="sub">${esc(app.nama)} · ${esc(app.no_pendaftaran)} · ${esc(app.universitas)} · ${esc(app.jenjang)} ${esc(prodi)} · Semester ${esc(app.semester)}</div>
      </div></div>

      <div class="two-col">
        <div>
          <section class="card">
            <h2 class="card-title">A. Syarat Akademik (syarat gugur)</h2>
            <p class="card-sub">Dicocokkan dengan surat pengantar perguruan tinggi. Satu syarat tidak terpenuhi berarti pendaftaran gugur.</p>
            ${SYARAT.map(([k, label, desc]) => `
              <div class="row-item"><div><h4>${label}</h4><p>${esc(desc(app))}</p></div>
              ${seg('syarat', k, state.syarat[k], [['memenuhi', 'Memenuhi', 'green'], ['tidak', 'Tidak memenuhi', 'red']])}</div>`).join('')}
          </section>

          <section class="card">
            <h2 class="card-title">B. Kelengkapan dan Kesesuaian Berkas</h2>
            <p class="card-sub">Buka setiap berkas, periksa butir yang tercantum, lalu tetapkan statusnya.</p>
            ${BERKAS.map((b, i) => {
              const f = files[b.jenis];
              return `<div class="doc-item">
                <div class="top"><div><h4>${i + 1}. ${esc(b.verif)}</h4>
                  <p>Periksa: ${esc(b.periksa)}</p></div>
                  ${f ? `<a class="link" href="backend/api/file.php?id=${f.id}" target="_blank" rel="noopener" data-pratinjau="${esc(b.verif)} · ${esc(app.nama)}" style="font-size:13px;white-space:nowrap;">Buka berkas</a>` : '<span class="pill red">Tidak ada</span>'}</div>
                ${seg('berkas', b.jenis, state.berkas[b.jenis], [['sesuai', 'Sesuai', 'green'], ['perbaikan', 'Perlu perbaikan', 'amber'], ['tidak_sesuai', 'Tidak ada / tidak sesuai', 'red']])}
              </div>`;
            }).join('')}
          </section>
        </div>

        <div class="sticky">
          <div id="result"></div>
          <section class="card">
            <label class="label" for="catatan">Catatan untuk pelamar</label>
            <textarea class="textarea" id="catatan" placeholder="Contoh: Scan KTM tidak terbaca. Unggah ulang dalam format PDF paling lambat [tanggal].">${esc(app.catatan_verifikasi || '')}</textarea>
            <p class="muted" style="font-size:12px;margin:6px 0 12px;">Wajib diisi: jelaskan berkas yang perlu diperbaiki atau alasan tidak memenuhi syarat.</p>
            <button type="button" class="btn btn-primary btn-block" id="saveBtn">Simpan dan kirim notifikasi</button>
          </section>
          <section class="card rules">
            <h3 style="font-size:14px;">Aturan hasil</h3>
            <p>Memenuhi syarat: seluruh syarat akademik terpenuhi dan kelima berkas sesuai.</p>
            <p>Perlu perbaikan: ada berkas berstatus perbaikan; pelamar diberi batas waktu ${esc(pengaturan.hari_perbaikan ?? 3)} hari kerja.</p>
            <p>Tidak memenuhi: ada syarat akademik tidak terpenuhi atau berkas tidak ada.</p>
          </section>
          <section class="card info-list">
            <h3 style="font-size:14px;margin-bottom:6px;">Data pelamar</h3>
            <div><span>Email</span><b>${esc(app.email)}</b></div>
            <div><span>HP/WhatsApp</span><b>${esc(app.no_wa)}</b></div>
            <div><span>Domisili</span><b>${esc(app.domisili)}</b></div>
            <div><span>NPM</span><b>${esc(app.nim)}</b></div>
            <div><span>IPK</span><b>${fmtAngka(app.ipk)}</b></div>
            <div><span>Batch</span><b>${esc(app.batch ? app.batch.nama : '-')}</b></div>
            <div><span>Pelaksanaan</span><b>${app.batch ? `${fmtTanggal(app.batch.mulai)} – ${fmtTanggal(app.batch.selesai)}` : '-'}</b></div>
            <button type="button" class="btn btn-danger btn-sm" id="deleteBtn" style="margin-top:12px;">Hapus pelamar</button>
          </section>
        </div>
      </div>`;

    document.querySelectorAll('.seg button').forEach(btn => btn.addEventListener('click', () => {
      state[btn.dataset.group][btn.dataset.key] = btn.dataset.value;
      render();
    }));
    document.getElementById('catatan').addEventListener('input', e => { app.catatan_verifikasi = e.target.value; updateResult(); });
    document.getElementById('saveBtn').addEventListener('click', save);
    document.getElementById('deleteBtn').addEventListener('click', hapus);
    document.getElementById('menuBtn').addEventListener('click', e => { e.stopPropagation(); document.getElementById('sidebar').classList.toggle('open'); });
    updateResult();
  }

  function updateResult() {
    const h = hasil();
    const nPerbaikan = Object.values(state.berkas).filter(v => v === 'perbaikan').length;
    const view = {
      memenuhi: ['green', 'Memenuhi Syarat', 'Seluruh syarat akademik terpenuhi dan kelima berkas sesuai. Pelamar lanjut ke tahap wawancara.'],
      perbaikan: ['amber', 'Perlu Perbaikan', `${nPerbaikan} berkas perlu diperbaiki. Pelamar menerima notifikasi dan batas waktu perbaikan.`],
      tidak_memenuhi: ['red', 'Tidak Memenuhi', 'Ada syarat akademik yang tidak terpenuhi atau berkas tidak ada/tidak sesuai. Pendaftaran gugur.'],
    }[h] || ['gray', 'Belum Lengkap', 'Tetapkan seluruh syarat akademik dan status kelima berkas.'];
    document.getElementById('result').innerHTML = `<div class="result ${view[0]}">
      <div class="kicker">Hasil verifikasi (otomatis)</div><h2>${view[1]}</h2><p>${view[2]}</p></div>`;
    const catatanOk = h === 'memenuhi' || (app.catatan_verifikasi || '').trim() !== '';
    document.getElementById('saveBtn').disabled = !h || !catatanOk;
  }

  async function save() {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    const res = await api('backend/api/admin/verify.php', { json: {
      id, syarat: state.syarat, berkas: state.berkas, catatan: document.getElementById('catatan').value,
    }});
    if (!res.success) { toast(res.message, true); btn.disabled = false; return; }
    toast('Hasil verifikasi disimpan.');
    setTimeout(() => { location.href = 'dashboard_admin.html'; }, 700);
  }

  async function hapus() {
    if (!await konfirmasi({ judul: `Hapus ${app.nama}?`, pesan: 'Akun, berkas, dan seluruh data pendaftarannya akan terhapus permanen dan tidak dapat dikembalikan.', ya: 'Hapus permanen', bahaya: true })) return;
    const res = await api('backend/api/admin/delete.php', { json: { id } });
    if (!res.success) { toast(res.message, true); return; }
    toast(res.message);
    setTimeout(() => { location.href = 'dashboard_admin.html'; }, 700);
  }
</script>
</body>
</html>
