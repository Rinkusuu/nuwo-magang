<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kehadiran — Backoffice Magang KPwBI Provinsi Lampung</title>
<meta name="theme-color" content="#0A2A4A">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/bi-logo-bulat.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/portal.css">
<script src="assets/gerak.js"></script>
<style>
  .filter-baris{display:grid;grid-template-columns:minmax(0,320px) 200px;gap:12px;margin-bottom:16px;}
  @media(max-width:560px){.filter-baris{grid-template-columns:minmax(0,1fr);}}
  .sel-absen b{display:block;font-size:15px;font-variant-numeric:tabular-nums;}
  .sel-absen small{display:block;font-size:12px;color:var(--ink-3);}
  .sel-absen .koreksi{color:var(--amber-text);font-weight:600;}
  .sel-absen button.link{font-size:12.5px;}
  .foto-absen{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:12px;}
  .peringatan-lokasi{margin-bottom:16px;}
</style>
</head>
<body data-menu="kehadiran">
<div class="bo">
  <aside class="bo-side" id="sidebar"></aside>
  <main class="bo-main">
    <button type="button" class="btn btn-outline btn-sm bo-menu-btn" id="menuBtn"><span data-ikon="menu"></span>Menu</button>
    <div class="page-head">
      <div>
        <h1>Kehadiran</h1>
        <div class="sub">Absen datang dan pulang peserta PKL per tanggal, lengkap dengan swafoto, jarak dari kantor, dan riwayat koreksi.</div>
      </div>
    </div>

    <div id="peringatanLokasi"></div>
    <div class="filter-baris">
      <div class="field"><label for="fBatch">Batch</label><select class="select" id="fBatch"><option value="">Semua batch aktif</option></select></div>
      <div class="field"><label for="fTanggal">Tanggal</label><input class="input" type="date" id="fTanggal"></div>
    </div>

    <div class="stats" style="grid-template-columns:repeat(4,minmax(0,1fr));">
      <div class="stat"><span>Peserta aktif</span><b id="stPeserta">–</b></div>
      <div class="stat"><span>Sudah datang</span><b id="stDatang">–</b></div>
      <div class="stat"><span>Sudah pulang</span><b id="stPulang">–</b></div>
      <div class="stat"><span>Belum absen</span><b id="stBelum">–</b></div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th>Peserta</th><th>Batch</th><th>Datang</th><th>Pulang</th><th>Aksi</th></tr></thead>
          <tbody id="rows" data-kerangka-tabel="5"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="assets/ikon.js"></script>
<script src="assets/common.js"></script>
<script src="assets/admin.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let daftar = [];

  (async () => {
    if (!await requireAdmin()) return;
    $('fTanggal').value = todayISO();
    const p = await api('backend/api/admin/periode.php');
    if (!p.periode || p.periode.kantor_lat === null) {
      $('peringatanLokasi').innerHTML = '<div class="notice amber peringatan-lokasi"><b>Lokasi kantor belum diatur</b>Peserta belum bisa absen. Atur titik kantor di <a class="link" href="admin_periode.html">Batch dan Jadwal → Pengaturan umum</a>.</div>';
    }
    muat(true);
  })();
  $('fBatch').addEventListener('input', () => muat());
  $('fTanggal').addEventListener('change', () => muat());

  async function muat(pertama = false) {
    const data = await api(`backend/api/admin/kehadiran.php?tanggal=${encodeURIComponent($('fTanggal').value)}&batch=${encodeURIComponent($('fBatch').value || 0)}`);
    if (!data.success) { toast(data.message, true); return; }
    if (pertama) $('fBatch').insertAdjacentHTML('beforeend', data.batch.map(b => `<option value="${b.id}">${esc(b.nama)}</option>`).join(''));
    daftar = data.data;
    $('stPeserta').textContent = daftar.length;
    $('stDatang').textContent = daftar.filter(r => r.datang).length;
    $('stPulang').textContent = daftar.filter(r => r.pulang).length;
    $('stBelum').textContent = daftar.filter(r => !r.datang).length;
    $('rows').removeAttribute('aria-busy');
    $('rows').innerHTML = daftar.length ? daftar.map(r => `
      <tr>
        <td class="name"><b>${esc(r.nama)}</b><span>${esc(r.no_pendaftaran)} · ${esc(r.universitas)}</span></td>
        <td>${esc(r.batch)}</td>
        <td>${selAbsen(r.datang)}</td>
        <td>${selAbsen(r.pulang)}</td>
        <td><button type="button" class="btn btn-outline btn-sm" data-koreksi="${r.id}">Koreksi</button></td>
      </tr>`).join('') : '<tr><td colspan="5" class="empty">Tidak ada peserta PKL aktif pada tanggal ini.</td></tr>';
  }

  function selAbsen(a) {
    if (!a) return '<span class="muted">Belum absen</span>';
    return `<div class="sel-absen"><b>${esc(a.waktu.slice(11, 16))}</b>
      ${a.jarak_m !== null ? `<small>${a.jarak_m} m dari kantor · ±${a.akurasi_m} m</small>` : ''}
      ${a.catatan_koreksi ? `<small class="koreksi" title="${esc(a.catatan_koreksi)}">Dikoreksi ${esc(a.dikoreksi_oleh || 'admin')}: ${esc(a.catatan_koreksi)}</small>` : ''}
      ${Number(a.ada_foto) ? `<button type="button" class="link" data-foto="${a.id}">Lihat swafoto</button>` : ''}</div>`;
  }

  $('rows').addEventListener('click', e => {
    const foto = e.target.closest('[data-foto]');
    if (foto) return lihatFoto(foto.dataset.foto);
    const kor = e.target.closest('[data-koreksi]');
    if (kor) bukaKoreksi(daftar.find(r => String(r.id) === kor.dataset.koreksi));
  });

  function lihatFoto(id) {
    const d = document.createElement('dialog');
    d.className = 'dialog';
    d.style.width = 'min(560px, calc(100% - 32px))';
    d.innerHTML = `<div class="isi"><img class="foto-absen" src="backend/api/absen/foto.php?id=${encodeURIComponent(id)}" alt="Swafoto absen"></div>
      <div class="aksi"><button type="button" class="btn btn-outline">Tutup</button></div>`;
    document.body.appendChild(d);
    const tutup = () => { d.close(); d.remove(); };
    d.querySelector('button').addEventListener('click', tutup);
    d.addEventListener('close', () => d.remove());
    d.addEventListener('click', ev => { if (ev.target === d) tutup(); });
    d.showModal();
  }

  // Koreksi absen: jam dan alasan wajib; tercatat siapa yang mengoreksi
  function bukaKoreksi(r) {
    const d = document.createElement('dialog');
    d.className = 'dialog';
    d.innerHTML = `<form class="isi" novalidate>
        <h2>Koreksi absen</h2>
        <p style="margin-bottom:14px;">${esc(r.nama)} · ${fmtTanggal($('fTanggal').value)}</p>
        <div class="grid-2" style="margin-bottom:12px;">
          <div class="field"><label for="kJenis">Jenis</label><select class="select" id="kJenis"><option value="datang">Datang</option><option value="pulang">Pulang</option></select></div>
          <div class="field"><label for="kJam">Jam (WIB)</label><input class="input" type="time" id="kJam"></div>
        </div>
        <div class="field"><label for="kAlasan">Alasan koreksi</label><textarea class="textarea" id="kAlasan" placeholder="Contoh: GPS peserta tidak terbaca; hadir sesuai konfirmasi pembimbing."></textarea></div>
      </form>
      <div class="aksi"><button type="button" class="btn btn-outline" value="batal">Batal</button><button type="button" class="btn btn-primary" value="simpan">Simpan koreksi</button></div>`;
    document.body.appendChild(d);
    const isiJam = () => { const a = r[d.querySelector('#kJenis').value]; d.querySelector('#kJam').value = a ? a.waktu.slice(11, 16) : ''; };
    d.querySelector('#kJenis').value = r.datang && !r.pulang ? 'pulang' : 'datang';
    isiJam();
    d.querySelector('#kJenis').addEventListener('change', isiJam);
    const tutup = () => { d.close(); d.remove(); };
    d.querySelector('[value="batal"]').addEventListener('click', tutup);
    d.addEventListener('cancel', ev => { ev.preventDefault(); tutup(); });
    d.querySelector('[value="simpan"]').addEventListener('click', async ev => {
      ev.target.disabled = true;
      const res = await api('backend/api/admin/kehadiran.php', { json: {
        application_id: r.id, tanggal: $('fTanggal').value, jenis: d.querySelector('#kJenis').value,
        jam: d.querySelector('#kJam').value, alasan: d.querySelector('#kAlasan').value } });
      ev.target.disabled = false;
      toast(res.message || (res.success ? 'Tersimpan.' : 'Gagal menyimpan.'), !res.success);
      if (res.success) { tutup(); muat(); }
    });
    d.showModal();
  }
</script>
</body>
</html>
