<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil dan Pengumuman — Backoffice Magang KPwBI Provinsi Lampung</title>
<meta name="theme-color" content="#0A2A4A">
<link rel="icon" href="assets/bi-logo-bulat.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="assets/portal.css">
<script src="assets/gerak.js"></script>
<style>
  .decide{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .decide .select{width:auto;min-width:190px;padding:7px 9px;font-size:13px;}
  .rank{font-weight:700;color:var(--ink-2);}
</style>
</head>
<body data-menu="hasil">
<div class="bo">
  <aside class="bo-side" id="sidebar"></aside>
  <main class="bo-main">
    <button type="button" class="btn btn-outline btn-sm bo-menu-btn" id="menuBtn"><span data-ikon="menu"></span>Menu</button>
    <div class="page-head">
      <div>
        <div class="meta">Periode <span id="tahun">–</span></div>
        <h1>Hasil dan Pengumuman</h1>
        <div class="sub">Peringkat berdasarkan rata-rata nilai wawancara. Hasil yang ditetapkan langsung tampil di dasbor pelamar.</div>
      </div>
    </div>

    <div class="stats" style="grid-template-columns:repeat(4,minmax(0,1fr));">
      <div class="stat"><span>Diterima / kuota</span><b id="stDiterima">–</b></div>
      <div class="stat"><span>Cadangan</span><b id="stCadangan">–</b></div>
      <div class="stat"><span>Tidak diterima</span><b id="stTidak">–</b></div>
      <div class="stat"><span>Belum ditetapkan</span><b id="stBelum">–</b></div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th>#</th><th>Pelamar</th><th>Bidang utama</th><th>Nilai wawancara</th><th>Hasil</th><th>Tetapkan hasil dan penempatan</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6" class="empty">Memuat data…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="assets/ikon.js"></script>
<script src="assets/common.js"></script>
<script src="assets/admin.js"></script>
<script>
  let rows = [], bidang = [], kuota = null;

  (async () => {
    if (!await requireAdmin()) return;
    await load();
  })();

  async function load() {
    const data = await api('backend/api/admin/applications.php');
    if (!data.success) { toast(data.message, true); return; }
    bidang = data.bidang;
    kuota = data.periode?.kuota ?? null;
    document.getElementById('tahun').textContent = data.periode?.tahun || '–';
    rows = data.data.filter(r => r.status_admin === 'memenuhi')
      .sort((a, b) => (b.nilai ?? -1) - (a.nilai ?? -1));
    render();
  }

  function render() {
    const count = h => rows.filter(r => r.hasil_akhir === h).length;
    document.getElementById('stDiterima').textContent = `${count('diterima')} / ${kuota ?? '–'}`;
    document.getElementById('stCadangan').textContent = count('cadangan');
    document.getElementById('stTidak').textContent = count('tidak_diterima');
    document.getElementById('stBelum').textContent = rows.filter(r => !r.hasil_akhir).length;

    document.getElementById('rows').innerHTML = rows.length ? rows.map((r, i) => `
      <tr data-id="${r.id}">
        <td class="rank">${i + 1}</td>
        <td class="name"><b>${esc(r.nama)}</b><span>${esc(r.no_pendaftaran)} · ${esc(r.universitas)}</span></td>
        <td>${esc(r.bidang_utama)}</td>
        <td>${r.nilai !== null
          ? `<b class="num">${fmtAngka(r.nilai)}</b> · ${esc(LABEL.rekomendasi[r.kategori])}<br><span class="muted" style="font-size:12.5px;">${r.jumlah_penilai} pewawancara</span>`
          : '<span class="muted">Belum dinilai</span>'}</td>
        <td>${r.hasil_akhir ? pill(LABEL.hasil, r.hasil_akhir) + (r.bidang_penempatan ? `<br><span class="muted" style="font-size:12.5px;">${esc(r.bidang_penempatan)}</span>` : '') : '<span class="muted">—</span>'}</td>
        <td><div class="decide">
          <select class="select" data-f="hasil" aria-label="Hasil">
            <option value="">Belum ditetapkan</option>
            ${Object.entries(LABEL.hasil).map(([k, [label]]) => `<option value="${k}" ${r.hasil_akhir === k ? 'selected' : ''}>${label}</option>`).join('')}
          </select>
          <select class="select" data-f="penempatan" aria-label="Bidang penempatan" ${r.hasil_akhir === 'diterima' ? '' : 'hidden'}>
            <option value="">Pilih penempatan</option>
            ${bidang.map(b => `<option value="${b.id}" ${String(r.bidang_penempatan_id ?? r.bidang_utama_id) === String(b.id) ? 'selected' : ''}>${esc(b.singkat)}</option>`).join('')}
          </select>
          <button type="button" class="btn btn-primary btn-sm" data-save>Simpan</button>
        </div></td>
      </tr>`).join('') : '<tr><td colspan="6" class="empty">Belum ada pelamar yang lolos verifikasi administrasi.</td></tr>';

    document.querySelectorAll('[data-f="hasil"]').forEach(sel => sel.addEventListener('change', () => {
      sel.closest('tr').querySelector('[data-f="penempatan"]').hidden = sel.value !== 'diterima';
    }));
    document.querySelectorAll('[data-save]').forEach(btn => btn.addEventListener('click', async () => {
      const tr = btn.closest('tr');
      const hasil = tr.querySelector('[data-f="hasil"]').value || null;
      const r = rows.find(x => x.id === Number(tr.dataset.id));
      if (hasil === 'diterima' && r.hasil_akhir !== 'diterima' && kuota !== null && rows.filter(x => x.hasil_akhir === 'diterima').length >= kuota
          && !confirm('Jumlah peserta diterima sudah mencapai kuota. Tetap terima pelamar ini?')) return;
      btn.disabled = true;
      const res = await api('backend/api/admin/decide.php', { json: {
        id: r.id, hasil_akhir: hasil, bidang_penempatan_id: tr.querySelector('[data-f="penempatan"]').value,
      }});
      btn.disabled = false;
      if (!res.success) { toast(res.message, true); return; }
      toast('Hasil seleksi disimpan.');
      await load();
    }));
  }
</script>
</body>
</html>
