<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peserta PKL · Backoffice Nuwo Magang</title>
<meta name="theme-color" content="#0A2A4A">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/bi-logo-bulat.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/portal.css">
<script src="assets/gerak.js"></script>
<style>
  .filter-batch{max-width:320px;margin-bottom:16px;}
  .berkas-sel a{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--navy-700);text-decoration:none;}
  .berkas-sel a:hover{text-decoration:underline;}
  .berkas-sel small{display:block;font-size:12px;color:var(--ink-3);}
</style>
</head>
<body data-menu="peserta">
<div class="bo">
  <aside class="bo-side" id="sidebar"></aside>
  <main class="bo-main">
    <button type="button" class="btn btn-outline btn-sm bo-menu-btn" id="menuBtn"><span data-ikon="menu"></span>Menu</button>
    <div class="page-head">
      <div>
        <h1>Peserta PKL</h1>
        <div class="sub">Peserta yang diterima, konfirmasi kesediaannya, serta logbook harian, dan laporan akhir yang sudah diunggah.</div>
      </div>
    </div>

    <div class="field filter-batch"><label for="fBatch">Batch</label><select class="select" id="fBatch"><option value="">Semua batch</option></select></div>

    <div class="stats" style="grid-template-columns:repeat(4,minmax(0,1fr));">
      <div class="stat"><span>Diterima</span><b id="stDiterima">–</b></div>
      <div class="stat"><span>Bersedia</span><b id="stBersedia">–</b></div>
      <div class="stat"><span>Mengisi logbook</span><b id="stLogbook">–</b></div>
      <div class="stat"><span>Laporan terunggah</span><b id="stLaporan">–</b></div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th>Peserta</th><th>Kontak</th><th>Periode</th><th>Kesediaan</th><th>Logbook</th><th>Laporan akhir</th></tr></thead>
          <tbody id="rows" data-kerangka-tabel="6"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="assets/ikon.js"></script>
<script src="assets/common.js"></script>
<script src="assets/admin.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let semua = [];

  (async () => {
    if (!await requireAdmin()) return;
    const data = await api('api/admin/peserta.php');
    if (!data.success) { toast(data.message, true); return; }
    semua = data.data;
    $('fBatch').insertAdjacentHTML('beforeend', data.batch.map(b => `<option value="${b.id}">${esc(b.nama)}</option>`).join(''));
    render();
  })();
  $('fBatch').addEventListener('input', render);

  function selBerkas(f, jenis) {
    if (!f) return '<span class="muted">Belum diunggah</span>';
    const pratinjau = jenis === 'laporan' ? ` data-pratinjau="Laporan akhir · ${esc(f.original_name)}"` : '';
    return `<div class="berkas-sel"><a href="api/pkl/file.php?id=${f.id}" target="_blank" rel="noopener"${pratinjau}>${ikon(jenis === 'laporan' ? 'dokumen' : 'unduh', 14)}${esc(f.original_name)}</a>
      <small>${fmtTanggal(f.uploaded_at)}</small></div>`;
  }

  function selLogbook(r) {
    const n = Number(r.hari_logbook);
    return `<span class="${n ? '' : 'muted'}">${n} hari terisi</span><br>
      <a class="link" href="api/pkl/logbook_excel.php?id=${encodeURIComponent(r.id)}" download>${ikon('unduh', 13)}Unduh Excel</a>`;
  }

  function render() {
    const id = $('fBatch').value;
    const rows = semua.filter(r => !id || String(r.batch_id) === id);
    $('stDiterima').textContent = rows.length;
    $('stBersedia').textContent = rows.filter(r => r.kesediaan === 'bersedia').length;
    $('stLogbook').textContent = rows.filter(r => Number(r.hari_logbook) > 0).length;
    $('stLaporan').textContent = rows.filter(r => r.berkas_pkl.laporan).length;
    $('rows').removeAttribute('aria-busy');
    $('rows').innerHTML = rows.length ? rows.map(r => `
      <tr>
        <td class="name"><b>${esc(r.nama)}</b><span>${esc(r.no_pendaftaran)} · ${esc(r.universitas)}</span></td>
        <td>${esc(r.email)}<br><span class="muted">${esc(r.no_wa || '')}</span></td>
        <td>${esc(r.batch || '-')}${r.mulai ? `<br><span class="muted" style="font-size:12.5px;">${fmtTanggal(r.mulai)} – ${fmtTanggal(r.selesai)}</span>` : ''}</td>
        <td>${r.kesediaan ? pill(LABEL.kesediaan, r.kesediaan) : '<span class="pill gray">Menunggu konfirmasi</span>'}</td>
        <td>${r.kesediaan === 'bersedia' ? selLogbook(r) : '<span class="muted">—</span>'}</td>
        <td>${r.kesediaan === 'bersedia' ? selBerkas(r.berkas_pkl.laporan, 'laporan') : '<span class="muted">—</span>'}</td>
      </tr>`).join('') : '<tr><td colspan="6" class="empty">Belum ada peserta yang diterima di batch ini.</td></tr>';
  }
</script>
</body>
</html>
