<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil dan Pengumuman · Backoffice Nuwo Magang</title>
<meta name="theme-color" content="#0A2A4A">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/bi-logo-bulat.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/portal.css">
<script src="assets/gerak.js"></script>
<style>
  .decide{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .decide .select{width:auto;min-width:190px;padding:7px 9px;font-size:13px;}
  .rank{font-weight:700;color:var(--ink-2);}
  .filter-batch{max-width:320px;margin-bottom:16px;}
</style>
</head>
<body data-menu="hasil">
<div class="bo">
  <aside class="bo-side" id="sidebar"></aside>
  <main class="bo-main">
    <button type="button" class="btn btn-outline btn-sm bo-menu-btn" id="menuBtn"><span data-ikon="menu"></span>Menu</button>
    <div class="page-head">
      <div>
        <h1>Hasil dan Pengumuman</h1>
        <div class="sub">Peringkat berdasarkan rata-rata nilai wawancara. Pelamar yang diterima mendapat email untuk mengonfirmasi kesediaan di halaman status.</div>
      </div>
    </div>

    <div class="field filter-batch"><label for="fBatch">Batch</label><select class="select" id="fBatch"><option value="">Semua batch</option></select></div>

    <div class="stats" style="grid-template-columns:repeat(4,minmax(0,1fr));">
      <div class="stat"><span>Diterima</span><b id="stDiterima">–</b></div>
      <div class="stat"><span>Bersedia</span><b id="stBersedia">–</b></div>
      <div class="stat"><span>Tidak diterima</span><b id="stTidak">–</b></div>
      <div class="stat"><span>Belum ditetapkan</span><b id="stBelum">–</b></div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th>#</th><th>Pelamar</th><th>Nilai wawancara</th><th>Hasil</th><th>Kesediaan</th><th>Tetapkan hasil</th></tr></thead>
          <tbody id="rows" data-kerangka-tabel="6"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="assets/ikon.js"></script>
<script src="assets/common.js"></script>
<script src="assets/admin.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let semua = [];

  (async () => {
    if (!await requireAdmin()) return;
    await muat(true);
  })();

  async function muat(pertama = false) {
    const data = await api('api/admin/applications.php');
    if (!data.success) { toast(data.message, true); return; }
    semua = data.data.filter(r => r.status_seleksi === 'lolos').sort((a, b) => (b.nilai ?? -1) - (a.nilai ?? -1));
    if (pertama) {
      $('fBatch').insertAdjacentHTML('beforeend', data.batch.map(b => `<option value="${b.id}">${esc(b.nama)}</option>`).join(''));
      if (semua[0]) $('fBatch').value = String(semua[0].batch_id || '');
    }
    render();
  }
  $('fBatch').addEventListener('input', render);

  function render() {
    const id = $('fBatch').value;
    const rows = semua.filter(r => !id || String(r.batch_id) === id);
    const hitung = f => rows.filter(f).length;
    $('stDiterima').textContent = hitung(r => r.hasil_akhir === 'diterima');
    $('stBersedia').textContent = hitung(r => r.kesediaan === 'bersedia');
    $('stTidak').textContent = hitung(r => r.hasil_akhir === 'tidak_diterima');
    $('stBelum').textContent = hitung(r => !r.hasil_akhir);

    $('rows').removeAttribute('aria-busy');
    $('rows').innerHTML = rows.length ? rows.map((r, i) => `
      <tr data-id="${r.id}">
        <td class="rank">${i + 1}</td>
        <td class="name"><b>${esc(r.nama)}</b><span>${esc(r.no_pendaftaran)} · ${esc(r.universitas)}${!id && r.batch ? ' · ' + esc(r.batch) : ''}</span></td>
        <td>${r.nilai !== null
          ? `<b class="num">${fmtAngka(r.nilai)}</b> · ${esc(LABEL.rekomendasi[r.kategori] || '')}<br><span class="muted" style="font-size:12.5px;">${r.jumlah_penilai} pewawancara</span>`
          : '<span class="muted">Belum dinilai</span>'}</td>
        <td>${r.hasil_akhir ? pill(LABEL.hasil, r.hasil_akhir) : '<span class="muted">—</span>'}</td>
        <td>${r.hasil_akhir !== 'diterima' ? '<span class="muted">—</span>' : r.kesediaan ? pill(LABEL.kesediaan, r.kesediaan) : '<span class="pill gray">Menunggu konfirmasi</span>'}</td>
        <td><div class="decide">
          <select class="select" data-f="hasil" aria-label="Hasil" ${r.kesediaan ? 'disabled' : ''}>
            <option value="">Belum ditetapkan</option>
            ${Object.entries(LABEL.hasil).map(([k, [label]]) => `<option value="${k}" ${r.hasil_akhir === k ? 'selected' : ''}>${label}</option>`).join('')}
          </select>
          <button type="button" class="btn btn-primary btn-sm" data-save ${r.kesediaan ? 'disabled' : ''}>Simpan</button>
        </div></td>
      </tr>`).join('') : '<tr><td colspan="6" class="empty">Belum ada pelamar yang lolos ke wawancara di batch ini.</td></tr>';
  }

  $('rows').addEventListener('click', async e => {
    const btn = e.target.closest('[data-save]');
    if (!btn) return;
    const tr = btn.closest('tr');
    const r = semua.find(x => String(x.id) === tr.dataset.id);
    const hasil = tr.querySelector('[data-f="hasil"]').value || null;
    if (hasil === r.hasil_akhir) { toast('Tidak ada perubahan.'); return; }
    if (hasil === 'diterima' && !await konfirmasi({ judul: `Terima ${r.nama}?`, pesan: 'Pelamar akan menerima email pengumuman dan diminta mengonfirmasi kesediaan di halaman status.', ya: 'Terima' })) return;
    btn.disabled = true;
    const res = await api('api/admin/decide.php', { json: { id: r.id, hasil_akhir: hasil } });
    btn.disabled = false;
    toast(res.message || (res.success ? 'Tersimpan.' : 'Gagal menyimpan.'), !res.success);
    if (res.success) await muat();
  });
</script>
</body>
</html>
