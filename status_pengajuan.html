<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Pendaftaran — Portal Magang Mahasiswa KPwBI Provinsi Lampung</title>
<meta name="theme-color" content="#0A2A4A">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/bi-logo-bulat.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/portal.css">
<script src="assets/gerak.js"></script>
<style>
  main.wrap{padding:40px 24px 64px;}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  .head .meta{font-size:13.5px;color:var(--ink-2);margin-bottom:4px;}
  .head h1{font-size:clamp(28px,3.4vw,40px);line-height:1.1;}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;}
  @media(max-width:960px){.cols{grid-template-columns:minmax(0,1fr);}}
  .side{display:flex;flex-direction:column;gap:20px;}
  .side .card + .card{margin-top:0;}

  .timeline{list-style:none;margin-top:14px;}
  .timeline li{position:relative;display:flex;gap:16px;padding-bottom:22px;}
  .timeline li:last-child{padding-bottom:0;}
  .timeline li::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line-strong);}
  .timeline li:last-child::before{display:none;}
  .timeline li.done::before{background:var(--green);transform-origin:top;}
  .gerak .timeline li{animation:naik .6s var(--ease) both;animation-delay:calc(var(--i,0) * 120ms + 80ms);}
  .gerak .timeline li.done::before{animation:isi-garis .7s var(--ease-in-out) both;animation-delay:calc(var(--i,0) * 120ms + 300ms);}
  .timeline li.current .dot::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid var(--navy-700);animation:cincin-halte 2.4s var(--ease) infinite;}
  .timeline .dot{width:30px;height:30px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--line-strong);background:#fff;color:var(--ink-2);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;}
  .timeline li.done .dot{background:var(--green);border-color:var(--green);color:#fff;}
  .timeline li.current .dot{background:var(--navy-700);border-color:var(--navy-700);color:#fff;}
  .timeline li.warn .dot{background:var(--amber);border-color:var(--amber);color:#fff;}
  .timeline li.fail .dot{background:var(--red);border-color:var(--red);color:#fff;}
  .timeline .body{flex:1;min-width:0;padding-top:3px;}
  .timeline .body b{display:block;font-size:14.5px;}
  .timeline li.pending .body b{font-weight:600;color:var(--ink-2);}
  .timeline .body p{font-size:13px;color:var(--ink-2);}
  .timeline .box{margin-top:10px;background:var(--navy-50);border:1px solid var(--navy-100);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .timeline .box span{display:block;font-size:12px;color:var(--ink-2);}
  .timeline .box strong{font-size:14px;}
  @media(max-width:600px){.timeline .box{grid-template-columns:1fr;}}
  .timeline .notice{margin-top:10px;}
  .hapus-akun{display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;}
  .hapus-akun svg{flex-shrink:0;margin-top:2px;}

  .summary .item{margin-top:10px;}
  .summary .item span{display:block;font-size:12.5px;color:var(--ink-2);}
  .summary .item b{font-size:14.5px;font-weight:600;}
  .files .row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:6px 0;}
  .files .row .st{font-weight:700;white-space:nowrap;}
  .st.green{color:var(--green);} .st.amber{color:var(--amber-text);} .st.red{color:var(--red);} .st.gray{color:var(--ink-3);}

  .head-aksi{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .kop-cetak,.nama-cetak{display:none;}

  /* Cetak / simpan PDF: satu halaman bukti tanpa navigasi, tombol, atau animasi */
  @media print{
    @page{size:A4;margin:16mm 14mm;}
    body{background:#fff !important;font-size:12px;}
    .topbar,.kaki-ringkas,#cetakBtn,.toast,.timeline .notice .btn{display:none !important;}
    main.wrap{padding:0 !important;max-width:none;}
    .kop-cetak{display:flex;align-items:center;gap:16px;padding-bottom:12px;margin-bottom:18px;border-bottom:2px solid #0A2A4A;}
    .kop-cetak img{height:30px;width:auto;}
    .kop-cetak b{display:block;font-size:15px;}
    .kop-cetak span{font-size:11px;color:#46566B;}
    .nama-cetak{display:block;font-size:12px;color:#46566B;margin-top:4px;}
    .head h1{font-size:24px;}
    .cols{grid-template-columns:minmax(0,1fr) 250px !important;gap:14px;}
    .card{box-shadow:none !important;border-color:#C6D3E2;padding:16px 18px;break-inside:avoid;}
    .timeline li,.timeline li::before{animation:none !important;opacity:1 !important;transform:none !important;}
    .timeline li.current .dot::after{display:none;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }

  .aksi-baris{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:12px;}
  .aksi-baris .muted{font-size:12.5px;max-width:420px;}
  .info-pkl{margin-top:14px;display:grid;gap:10px;background:var(--navy-50);border:1px solid var(--navy-100);border-radius:12px;padding:12px 14px;}
  .info-pkl span{display:block;font-size:12px;color:var(--ink-2);}
  .info-pkl b{font-size:13.5px;font-weight:600;}
  .berkas-pkl .baris-pkl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .berkas-pkl .baris-pkl:first-of-type{border-top:none;}
  .berkas-pkl .txt{min-width:0;}
  .berkas-pkl .txt b{display:block;font-size:14px;}
  .berkas-pkl .txt span,.berkas-pkl .txt small{display:block;font-size:12px;color:var(--ink-3);}
  .berkas-pkl .txt a{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--navy-700);font-weight:600;margin-top:4px;word-break:break-all;}
  .berkas-pkl label.btn{flex-shrink:0;cursor:pointer;}
  .berkas-pkl .baris-pkl.sedang{opacity:.6;pointer-events:none;}
  .berkas-pkl .baris-pkl.sedang label.btn::after{content:"";width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;}
  .empty{max-width:560px;margin:40px auto;text-align:center;}
  .empty h2{font-size:24px;margin-bottom:8px;}
  .empty p{color:var(--ink-2);margin-bottom:18px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="dashboard.html" class="title" aria-label="Portal Magang Mahasiswa, ke beranda"><span class="logo-mark dark"><img src="assets/bi-logo-bulat.webp" alt="" width="30" height="30"></span><span class="teks">Portal Magang Mahasiswa</span> <span class="full">· KPwBI Provinsi Lampung</span></a>
    <div class="right">
      <a href="formulir.html" class="nav-link">Formulir</a>
      <span class="user"><span class="avatar" id="avatar">–</span><span class="name" id="userName"></span></span>
      <button type="button" class="link" id="logoutBtn">Keluar</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"><div class="loading" data-kerangka>Memuat status pendaftaran…</div></main>

<footer class="kaki-ringkas">
  <div class="wrap">
    <img src="assets/bi-logo.webp" alt="Bank Indonesia" width="360" height="65">
    <span>Program Magang Mahasiswa · Kantor Perwakilan Bank Indonesia Provinsi Lampung</span>
    <a href="https://www.bi.go.id" target="_blank" rel="noopener">bi.go.id</a>
  </div>
</footer>

<script src="assets/ikon.js"></script>
<script src="assets/common.js"></script>
<script>
  document.getElementById('logoutBtn').addEventListener('click', () => logout('login.html'));

  (async () => {
    const me = await api('backend/api/auth/me.php');
    if (!me.success) { window.location.href = 'login.html'; return; }
    document.getElementById('avatar').textContent = initials(me.user.nama);
    document.getElementById('userName').textContent = me.user.nama;

    const st = await api('backend/api/formulir/status.php');
    const main = document.getElementById('main');
    if (!st.success) { main.innerHTML = `<div class="notice red">${esc(st.message)}</div>`; return; }

    if (!st.has_application || !st.application.submitted_at) {
      main.innerHTML = `<div class="card empty">
        <h2>Pendaftaran belum dikirim</h2>
        <p>Lengkapi formulir, unggah lima berkas administrasi, lalu kirim pendaftaran agar dapat diproses oleh tim seleksi.</p>
        <a href="formulir.html" class="btn btn-primary">${st.has_application ? 'Lanjutkan Formulir' : 'Isi Formulir'}</a></div>`;
      return;
    }
    render(st.application, st.files || {}, st.batch, st.berkas_pkl || {});
  })();

  const rentangTanggal = (x, y) => `${fmtTanggal(x)} – ${fmtTanggal(y)}`;

  function render(a, files, batch, berkasPkl) {
    const steps = [];
    let tahap;

    // 1. Pendaftaran dikirim
    steps.push({ cls: 'done', title: 'Pendaftaran dikirim', text: `Lima berkas administrasi terunggah lengkap · ${fmtTanggal(a.submitted_at)}.` });

    // 2. Verifikasi administrasi
    if (a.status_admin === 'menunggu') {
      tahap = 'Verifikasi Administrasi';
      steps.push({ cls: 'current', n: 2, title: 'Verifikasi administrasi sedang diproses', text: 'Tim memeriksa kelengkapan berkas dan syarat akademik Anda.' });
    } else if (a.status_admin === 'perbaikan') {
      tahap = 'Perbaikan Berkas';
      steps.push({ cls: 'warn', n: ikon('peringatan', 14), title: 'Verifikasi administrasi: Perlu perbaikan', text: '',
        extra: `<div class="notice amber">${esc(a.catatan_verifikasi || '')}
          ${a.batas_perbaikan ? `<br>Batas waktu perbaikan: <strong>${fmtTanggal(a.batas_perbaikan)}</strong>.` : ''}
          <div style="margin-top:10px;"><a href="formulir.html#s4" class="btn btn-primary btn-sm">Perbaiki berkas</a></div></div>` });
    } else if (a.status_admin === 'tidak_memenuhi') {
      tahap = 'Selesai';
      steps.push({ cls: 'fail', n: ikon('tutup', 13), title: 'Verifikasi administrasi: Tidak memenuhi syarat',
        extra: a.catatan_verifikasi ? `<div class="notice red">${esc(a.catatan_verifikasi)}</div>` : '' });
    } else {
      steps.push({ cls: 'done', title: 'Verifikasi administrasi: Berkas lengkap', text: `Jenjang ${esc(a.jenjang)}, semester ${esc(a.semester)}, dan seluruh berkas dinyatakan sesuai.` });
    }

    // 3. Seleksi berkas untuk wawancara (screening manual oleh tim)
    if (a.status_admin !== 'memenuhi') {
      steps.push({ cls: 'pending', n: 3, title: 'Seleksi berkas', text: 'Untuk pelamar yang berkasnya lengkap.' });
    } else if (!a.status_seleksi) {
      tahap = 'Seleksi Berkas';
      steps.push({ cls: 'current', n: 3, title: 'Seleksi berkas sedang diproses', text: 'Tim menyeleksi berkas untuk menentukan pelamar yang diundang ke wawancara daring.' });
    } else if (a.status_seleksi === 'tidak_lolos') {
      tahap = 'Selesai';
      steps.push({ cls: 'fail', n: ikon('tutup', 13), title: 'Seleksi berkas: Belum lolos ke tahap wawancara', text: 'Terima kasih atas minat Anda mengikuti PKL di KPwBI Provinsi Lampung.' });
    } else {
      steps.push({ cls: 'done', title: 'Seleksi berkas: Lolos ke tahap wawancara' });
    }

    // 4. Wawancara daring: satu jadwal dan satu link Zoom untuk seluruh pelamar di batch ini
    if (a.status_seleksi !== 'lolos') {
      steps.push({ cls: 'pending', n: 4, title: 'Wawancara daring', text: 'Untuk pelamar yang lolos seleksi berkas.' });
    } else {
      const ada = batch && batch.wawancara_tanggal;
      const box = ada ? `<div class="box">
          <div><span>Tanggal</span><strong>${fmtTanggal(batch.wawancara_tanggal)}</strong></div>
          <div><span>Waktu</span><strong>${batch.wawancara_jam ? esc(String(batch.wawancara_jam).slice(0, 5)) + ' WIB' : 'Akan diumumkan'}</strong></div>
          <div><span>Tempat</span><strong>Zoom (daring)</strong></div></div>`
        : '<div class="notice blue">Jadwal wawancara akan diumumkan di halaman ini.</div>';
      const zoom = batch && batch.link_zoom && !a.hasil_akhir
        ? `<div class="aksi-baris"><a class="btn btn-primary btn-sm" href="${esc(batch.link_zoom)}" target="_blank" rel="noopener">${ikon('tautan', 14)}Buka Zoom wawancara</a>
            <span class="muted">Seluruh pelamar masuk ke ruang Zoom yang sama, lalu diwawancarai satu per satu di breakout room.</span></div>`
        : (!a.hasil_akhir ? '<p class="muted" style="margin-top:8px;font-size:13px;">Tautan Zoom akan tersedia di sini menjelang wawancara.</p>' : '');
      if (a.hasil_akhir) steps.push({ cls: 'done', title: 'Wawancara selesai' });
      else { tahap = 'Wawancara'; steps.push({ cls: 'current', n: 4, title: 'Wawancara daring', extra: box + zoom }); }
    }

    // 5. Pengumuman
    if (a.hasil_akhir === 'diterima') {
      steps.push({ cls: 'done', title: 'Pengumuman: Diterima', text: 'Selamat, Anda diterima sebagai peserta PKL.' });
    } else if (a.hasil_akhir === 'tidak_diterima') {
      tahap = 'Selesai';
      steps.push({ cls: 'fail', n: ikon('tutup', 13), title: 'Pengumuman: Tidak diterima', text: 'Terima kasih telah mengikuti seluruh rangkaian seleksi PKL.' });
    } else {
      steps.push({ cls: 'pending', n: 5, title: 'Pengumuman', text: 'Hasil diumumkan melalui halaman ini dan email.' });
    }

    // 6. Kesediaan dan pelaksanaan PKL
    const periodePkl = batch ? rentangTanggal(batch.mulai, batch.selesai) : '';
    if (a.hasil_akhir !== 'diterima') {
      steps.push({ cls: 'pending', n: 6, title: 'Konfirmasi kesediaan dan pelaksanaan PKL', text: 'Peserta yang diterima mengonfirmasi kesediaan, lalu menjalani PKL selama 2 bulan.' });
    } else if (!a.kesediaan) {
      tahap = 'Konfirmasi Kesediaan';
      steps.push({ cls: 'current', n: 6, title: 'Konfirmasi kesediaan mengikuti PKL',
        text: `Apakah Anda bersedia mengikuti PKL${periodePkl ? ` pada ${periodePkl}` : ''}? Pilihan ini hanya dapat dibuat sekali.`,
        extra: `<div class="aksi-baris">
          <button type="button" class="btn btn-primary btn-sm" data-kesediaan="bersedia">${ikon('centang', 14)}Ya, saya bersedia</button>
          <button type="button" class="btn btn-danger btn-sm" data-kesediaan="tidak_bersedia">Tidak bersedia</button></div>` });
    } else if (a.kesediaan === 'tidak_bersedia') {
      tahap = 'Selesai';
      steps.push({ cls: 'fail', n: ikon('tutup', 13), title: 'Anda mengundurkan diri', text: 'Anda menyatakan tidak bersedia mengikuti PKL periode ini.' });
    } else {
      tahap = 'Pelaksanaan PKL';
      const wa = batch && batch.link_wa
        ? `<a class="btn btn-primary btn-sm" href="${esc(batch.link_wa)}" target="_blank" rel="noopener">${ikon('obrolan', 14)}Gabung grup WhatsApp peserta</a>`
        : '<span class="muted">Tautan grup WhatsApp peserta akan tersedia di sini.</span>';
      steps.push({ cls: 'current', n: 6, title: 'Pelaksanaan PKL', text: periodePkl ? `Periode PKL: ${periodePkl}.` : '',
        extra: `<div class="aksi-baris"><a class="btn btn-primary btn-sm" href="absen.html">${ikon('kalender', 14)}Absen hari ini</a>${wa.replace('btn btn-primary', 'btn btn-outline')}</div>
          <div class="info-pkl">
            <div><span>Hari dan jam kerja</span><b>Senin–Jumat, pukul 07.10–16.30 WIB</b></div>
            <div><span>Pakaian</span><b>Baju putih, celana hitam, dan sepatu hitam. Setiap Selasa dan Jumat memakai batik.</b></div>
          </div>` });
    }

    const berkasRows = BERKAS.map(b => {
      const f = files[b.jenis];
      const [label, color] = !f ? ['Belum diunggah', 'gray'] : (LABEL.berkas[f.status_verifikasi] || ['Menunggu', 'gray']);
      return `<div class="row"><span>${esc(b.singkat)}</span><span class="st ${color}">${label}</span></div>`;
    }).join('');

    const gagal = a.status_admin === 'tidak_memenuhi' || a.status_seleksi === 'tidak_lolos' || a.hasil_akhir === 'tidak_diterima' || a.kesediaan === 'tidak_bersedia';
    const pillTahap = gagal ? 'red' : a.status_admin === 'perbaikan' ? 'amber' : a.kesediaan === 'bersedia' ? 'green' : 'blue';
    const bolehUnggah = a.hasil_akhir === 'diterima' && a.kesediaan === 'bersedia';

    document.getElementById('main').innerHTML = `
      <div class="kop-cetak" aria-hidden="true">
        <img src="assets/bi-logo.webp" alt="" width="360" height="65">
        <div><b>Bukti Pendaftaran PKL Mahasiswa</b><span>Kantor Perwakilan Bank Indonesia Provinsi Lampung · dicetak ${fmtTanggal(todayISO())}</span></div>
      </div>
      <div class="head">
        <div><div class="meta">No. pendaftaran ${esc(a.no_pendaftaran)}</div><h1>Status Pendaftaran Anda</h1><div class="nama-cetak">${esc(a.nama)} · ${esc(a.email)}</div></div>
        <div class="head-aksi">
          <span class="pill ${pillTahap} lg">Tahap saat ini: ${esc(tahap)}</span>
          <button type="button" class="btn btn-outline btn-sm" id="cetakBtn"><span data-ikon="unduh" data-ikon-ukuran="15"></span>Cetak bukti pendaftaran</button>
        </div>
      </div>
      ${a.hapus_pada ? `<div class="notice amber hapus-akun">${ikon('peringatan', 16)}<span><b>Akun akan dihapus ${fmtTanggal(a.hapus_pada)}</b>Akun dan seluruh data pendaftaran Anda dihapus otomatis pada tanggal tersebut. Simpan informasi yang Anda perlukan sebelumnya.</span></div>` : ''}
      <div class="cols">
        <section class="card">
          <h2 class="card-title">Perjalanan Seleksi</h2>
          <ol class="timeline">
            ${steps.map((s, i) => `<li class="${s.cls}" style="--i:${i}">
              <span class="dot">${s.cls === 'done' ? ikon('centang', 14) : s.n}</span>
              <div class="body"><b>${s.title}</b>${s.text ? `<p>${s.text}</p>` : ''}${s.extra || ''}</div></li>`).join('')}
          </ol>
        </section>
        <div class="side">
          ${bolehUnggah ? `<section class="card berkas-pkl" id="berkasPkl">
            <h2 class="card-title">Logbook dan Laporan Akhir</h2>
            <p class="card-sub">Logbook diisi setiap hari di halaman absen dan tersusun otomatis menjadi Excel.</p>
            <div class="baris-pkl">
              <div class="txt"><b>Logbook</b><span>Excel sesuai format logbook kantor, berisi kegiatan serta jam masuk dan jam keluar.</span></div>
              <a class="btn btn-outline btn-sm" href="backend/api/pkl/logbook_excel.php" download>${ikon('unduh', 14)}Unduh</a>
            </div>
            ${barisPkl('laporan', 'Laporan akhir', 'PDF, maks. 10 MB. Unggahan baru menggantikan berkas sebelumnya.', '.pdf,application/pdf', berkasPkl.laporan)}
          </section>` : ''}
          <section class="card summary">
            <h2 class="card-title">Ringkasan Pendaftaran</h2>
            <div class="item"><span>Perguruan tinggi</span><b>${esc(a.universitas)}</b></div>
            <div class="item"><span>Program studi / Semester</span><b>${esc(a.jenjang)} ${esc(prodi(a.fakultas_prodi))} · Semester ${esc(a.semester)}</b></div>
            <div class="item"><span>Periode PKL</span><b>${esc(batch ? batch.nama : '-')}</b></div>
            ${batch ? `<div class="item"><span>Pelaksanaan</span><b>${periodePkl}</b></div>` : ''}
          </section>
          <section class="card files">
            <h2 class="card-title">Berkas</h2>
            ${berkasRows}
          </section>
        </div>
      </div>`;
  }

  function barisPkl(jenis, judul, ket, terima, f) {
    return `<div class="baris-pkl" data-jenis="${jenis}">
      <div class="txt"><b>${judul}</b><span>${ket}</span>
        ${f ? `<a href="backend/api/pkl/file.php?id=${f.id}" target="_blank" rel="noopener">${ikon('dokumen', 13)}${esc(f.original_name)}</a><small>Diunggah ${fmtTanggal(f.uploaded_at)}</small>` : '<small>Belum diunggah</small>'}</div>
      <label class="btn btn-outline btn-sm">${ikon('unggah', 14)}${f ? 'Ganti' : 'Unggah'}<input type="file" accept="${terima}" data-unggah-pkl="${jenis}" hidden></label>
    </div>`;
  }

  // Kesediaan: konfirmasi dulu, karena pilihan hanya dapat dibuat sekali
  document.addEventListener('click', async e => {
    const btn = e.target.closest('[data-kesediaan]');
    if (!btn) return;
    const bersedia = btn.dataset.kesediaan === 'bersedia';
    const ok = await konfirmasi(bersedia
      ? { judul: 'Bersedia mengikuti PKL?', pesan: 'Setelah dikonfirmasi, Anda akan mendapatkan tautan grup WhatsApp peserta. Pilihan ini tidak dapat diubah.', ya: 'Ya, saya bersedia' }
      : { judul: 'Tidak bersedia mengikuti PKL?', pesan: 'Anda akan dicatat mengundurkan diri dari PKL periode ini. Pilihan ini tidak dapat diubah.', ya: 'Ya, saya mengundurkan diri', bahaya: true });
    if (!ok) return;
    document.querySelectorAll('[data-kesediaan]').forEach(b => { b.disabled = true; });
    const res = await api('backend/api/pkl/kesediaan.php', { json: { kesediaan: btn.dataset.kesediaan } });
    toast(res.message || (res.success ? 'Tersimpan.' : 'Gagal menyimpan.'), !res.success);
    if (res.success) muatUlang();
    else document.querySelectorAll('[data-kesediaan]').forEach(b => { b.disabled = false; });
  });

  // Unggah laporan akhir
  document.addEventListener('change', async e => {
    const input = e.target.closest('[data-unggah-pkl]');
    if (!input || !input.files[0]) return;
    const file = input.files[0];
    const jenis = input.dataset.unggahPkl;
    const maks = 10;
    if (file.size > maks * 1048576) { toast(`Ukuran berkas melebihi ${maks} MB.`, true); input.value = ''; return; }
    const baris = input.closest('.baris-pkl');
    baris.classList.add('sedang');
    const fd = new FormData();
    fd.append('jenis', jenis);
    fd.append('file', file);
    const res = await api('backend/api/pkl/upload.php', { method: 'POST', body: fd });
    baris.classList.remove('sedang');
    input.value = '';
    toast(res.message || (res.success ? 'Berkas terunggah.' : 'Berkas gagal diunggah.'), !res.success);
    if (res.success) muatUlang();
  });

  async function muatUlang() {
    const st = await api('backend/api/formulir/status.php');
    if (st.success && st.has_application) render(st.application, st.files || {}, st.batch, st.berkas_pkl || {});
  }

  document.addEventListener('click', e => { if (e.target.closest('#cetakBtn')) window.print(); });

  // "Fakultas Ekonomi dan Bisnis / Ekonomi Pembangunan" → "Ekonomi Pembangunan"
  function prodi(s) { const parts = String(s || '').split('/'); return parts[parts.length - 1].trim(); }
</script>
</body>
</html>
