# Contoh blok server Nginx + PHP-FPM untuk Portal Magang Mahasiswa.
# Sesuaikan server_name, root, dan socket PHP-FPM. Sertifikat TLS: certbot --nginx.

server {
    listen 80;
    server_name magang.contoh.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name magang.contoh.go.id;
    root /var/www/portal-magang;
    index dashboard.html;

    client_max_body_size 4m;          # berkas PDF maksimal 2 MB
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;   # pratinjau PDF di halaman sendiri
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 404 /404.html;

    # Berkas yang tidak boleh diakses dari web
    location ~ /\.                                   { return 404; }
    location ~ \.(sql|md|log|lock|dist)$             { return 404; }
    location ^~ /deploy/                             { return 404; }
    location ~ ^/backend/(vendor|logs|migrasi|uploads)(/|$) { return 404; }
    location ~ ^/backend/(config|config\.local|config\.local\.example|app_helpers|mailer|batas_percobaan|atur_password_admin)\.php$ { return 404; }
    location = /backend/composer.json                { return 404; }

    # Catatan: jangan pakai add_header di dalam location — itu membatalkan
    # seluruh header keamanan di atas. "expires" aman dipakai.
    location ~* \.(woff2|png|jpe?g|svg|ico|webp)$ {
        expires 30d;
        try_files $uri =404;
    }
    location ~* \.(css|js|html)$ {
        expires -1;
        try_files $uri =404;
    }

    # Berkas PDF: tanpa CSP (penampil PDF peramban), tetap tanpa sniffing dan tetap satu situs
    location = /backend/api/file.php {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ ^/backend/api/.+\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    # PHP lain di luar backend/api tidak dijalankan
    location ~ \.php$ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
