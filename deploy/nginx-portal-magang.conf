# Nuwo Magang, Nginx + PHP-FPM. Sesuaikan server_name, root, dan socket PHP-FPM.

server {
    listen 80;
    server_name magang.contoh.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name magang.contoh.go.id;
    root /var/www/portal-magang;
    index dashboard.html;

    client_max_body_size 12m;         # laporan akhir maksimal 10 MB
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 404 /404.html;

    location ~ /\.                                   { return 404; }
    location ~ \.(sql|md|log|lock|dist)$             { return 404; }
    location ^~ /deploy/                             { return 404; }
    location ~ ^/backend/(vendor|logs|migrasi|uploads|font)(/|$) { return 404; }
    location ~ ^/backend/(config|config\.local|config\.local\.example|app_helpers|absen_helpers|mailer|batas_percobaan|atur_password_admin)\.php$ { return 404; }
    location = /backend/composer.json                { return 404; }

    # add_header di dalam location membatalkan header di atas
    location ~* \.(woff2|png|jpe?g|svg|ico|webp)$ {
        expires 30d;
        try_files $uri =404;
    }
    location ~* \.(css|js|html)$ {
        expires -1;
        try_files $uri =404;
    }

    # PDF tanpa CSP agar penampil PDF peramban jalan
    location ~ ^/backend/api/(pkl/)?file\.php$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ ^/backend/api/.+\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
