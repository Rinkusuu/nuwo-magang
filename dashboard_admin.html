<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Pelamar · Backoffice Nuwo Magang</title>
<meta name="theme-color" content="#0A2A4A">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/bi-logo-bulat.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/portal.css">
<script src="assets/gerak.js"></script>
<style>
  td .score b{font-variant-numeric:tabular-nums;}
  td .score span{color:var(--ink-2);}
  td .reason{color:var(--ink-2);}
  td .sel-seleksi{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;}
</style>
</head>
<body data-menu="pelamar">
<div class="bo">
  <aside class="bo-side" id="sidebar"></aside>
  <main class="bo-main">
    <button type="button" class="btn btn-outline btn-sm bo-menu-btn" id="menuBtn"><span data-ikon="menu"></span>Menu</button>
    <div class="page-head">
      <div>
        <h1>Daftar Pelamar</h1>
      </div>
      <a href="backend/api/admin/export.php" class="btn btn-outline">Ekspor ke Excel</a>
    </div>

    <div class="stats">
      <div class="stat"><span>Total pendaftar</span><b id="stTotal">–</b></div>
      <div class="stat"><span>Menunggu verifikasi</span><b id="stMenunggu">–</b></div>
      <div class="stat"><span>Berkas lengkap</span><b id="stLolos">–</b></div>
      <div class="stat"><span>Lolos ke wawancara</span><b id="stDinilai">–</b></div>
      <div class="stat"><span>Diterima</span><b id="stDiterima">–</b></div>
    </div>

    <div class="filters">
      <div class="field"><label for="q">Cari</label><input class="input" id="q" placeholder="Nama, NPM, atau nomor pendaftaran"></div>
      <div class="field"><label for="fPt">Perguruan tinggi</label><select class="select" id="fPt"><option value="">Semua</option></select></div>
      <div class="field"><label for="fBatch">Batch</label><select class="select" id="fBatch"><option value="">Semua batch</option></select></div>
      <div class="field"><label for="fStatus">Status</label>
        <select class="select" id="fStatus">
          <option value="">Semua status</option>
          <option value="menunggu">Menunggu verifikasi</option>
          <option value="perbaikan">Perlu perbaikan</option>
          <option value="memenuhi">Memenuhi</option>
          <option value="tidak_memenuhi">Tidak memenuhi</option>
          <option value="lolos">Lolos ke wawancara</option>
          <option value="tidak_lolos">Tidak lolos ke wawancara</option>
          <option value="dinilai">Sudah dinilai</option>
          <option value="diterima">Diterima</option>
        </select>
      </div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th data-urut="nama"><button type="button" class="urut">Pelamar</button></th><th data-urut="universitas"><button type="button" class="urut">Perguruan tinggi</button></th><th data-urut="semester"><button type="button" class="urut">Prodi · Smt</button></th><th data-urut="batch"><button type="button" class="urut">Batch</button></th><th data-urut="status_admin"><button type="button" class="urut">Administrasi</button></th><th data-urut="nilai"><button type="button" class="urut">Seleksi dan nilai</button></th><th>Aksi</th></tr></thead>
          <tbody id="rows" data-kerangka-tabel="7"></tbody>
        </table>
      </div>
      <div class="halaman-tabel" id="halaman" aria-label="Halaman tabel"></div>
    </div>
  </main>
</div>

<script src="assets/ikon.js"></script>
<script src="assets/common.js"></script>
<script src="assets/admin.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get('status')) {
    document.getElementById('fStatus').value = params.get('status');
    if (params.get('status') === 'menunggu') document.body.dataset.menu = 'verifikasi';
  }

  let rows = [];
  const PER_HALAMAN = 20;
  let halaman = 1;
  let urut = { kunci: null, arah: 1 };
  const URUTAN_STATUS = { menunggu: 0, perbaikan: 1, memenuhi: 2, tidak_memenuhi: 3 };

  (async () => {
    if (!await requireAdmin()) return;
    const data = await api('backend/api/admin/applications.php');
    if (!data.success) { toast(data.message, true); return; }
    rows = data.data;

    document.getElementById('stTotal').textContent = rows.length;
    document.getElementById('stMenunggu').textContent = rows.filter(r => r.status_admin === 'menunggu').length;
    document.getElementById('stLolos').textContent = rows.filter(r => r.status_admin === 'memenuhi').length;
    document.getElementById('stDinilai').textContent = rows.filter(r => r.status_seleksi === 'lolos').length;
    document.getElementById('stDiterima').textContent = rows.filter(r => r.hasil_akhir === 'diterima').length;

    const pts = [...new Set(rows.map(r => r.universitas).filter(Boolean))].sort();
    document.getElementById('fPt').insertAdjacentHTML('beforeend', pts.map(u => `<option>${esc(u)}</option>`).join(''));
    document.getElementById('fBatch').insertAdjacentHTML('beforeend', data.batch.map(b => `<option value="${b.id}">${esc(b.nama)}</option>`).join(''));
    if (params.get('batch')) document.getElementById('fBatch').value = params.get('batch');
    render();
  })();

  ['q', 'fPt', 'fBatch', 'fStatus'].forEach(id => document.getElementById(id).addEventListener('input', () => { halaman = 1; render(); }));

  document.querySelectorAll('th[data-urut] button').forEach(btn => btn.addEventListener('click', () => {
    const kunci = btn.parentElement.dataset.urut;
    if (urut.kunci !== kunci) urut = { kunci, arah: 1 };
    else if (urut.arah === 1) urut.arah = -1;
    else urut = { kunci: null, arah: 1 };
    document.querySelectorAll('th[data-urut]').forEach(th => {
      if (th.dataset.urut === urut.kunci) th.setAttribute('aria-sort', urut.arah === 1 ? 'ascending' : 'descending');
      else th.removeAttribute('aria-sort');
    });
    halaman = 1;
    render();
  }));

  function nilaiUrut(r, kunci) {
    if (kunci === 'status_admin') return URUTAN_STATUS[r.status_admin] ?? 9;
    if (kunci === 'nilai' || kunci === 'semester') return r[kunci] === null ? null : Number(r[kunci]);
    return String(r[kunci] ?? '').toLowerCase();
  }

  function renderHalaman(total) {
    const el = document.getElementById('halaman');
    const jumlahHalaman = Math.ceil(total / PER_HALAMAN);
    if (jumlahHalaman <= 1) { el.innerHTML = ''; return; }
    const awal = (halaman - 1) * PER_HALAMAN + 1;
    const akhir = Math.min(total, halaman * PER_HALAMAN);
    const nomor = [];
    for (let i = 1; i <= jumlahHalaman; i++) {
      if (i === 1 || i === jumlahHalaman || Math.abs(i - halaman) <= 1) nomor.push(i);
      else if (nomor[nomor.length - 1] !== '…') nomor.push('…');
    }
    el.innerHTML = `<span>Menampilkan ${awal}–${akhir} dari ${total} pelamar</span>
      <div class="nomor">
        <button type="button" data-ke="${halaman - 1}" ${halaman === 1 ? 'disabled' : ''} aria-label="Halaman sebelumnya">${ikon('kembali', 14)}</button>
        ${nomor.map(n => n === '…' ? '<button type="button" disabled>…</button>'
          : `<button type="button" data-ke="${n}" ${n === halaman ? 'aria-current="page"' : ''}>${n}</button>`).join('')}
        <button type="button" data-ke="${halaman + 1}" ${halaman === jumlahHalaman ? 'disabled' : ''} aria-label="Halaman berikutnya">${ikon('lanjut', 14)}</button>
      </div>`;
    el.querySelectorAll('[data-ke]').forEach(b => b.addEventListener('click', () => {
      halaman = +b.dataset.ke;
      render();
      document.querySelector('.table-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }

  function prodi(s) { const parts = String(s || '').split('/'); return parts[parts.length - 1].trim(); }

  function nilaiCell(r) {
    if (r.status_admin === 'tidak_memenuhi') return `<span class="reason">${esc(r.alasan)}</span>`;
    if (r.status_admin !== 'memenuhi') return '<span class="muted">—</span>';
    if (!r.status_seleksi) return '<span class="reason">Menunggu seleksi berkas</span>';
    const seleksi = pill(LABEL.seleksi, r.status_seleksi);
    if (r.status_seleksi !== 'lolos') return seleksi;
    const nilai = r.nilai === null ? '<span class="reason">Belum dinilai</span>'
      : `<span class="score"><b>${fmtAngka(r.nilai)}</b> · <span>${esc(LABEL.rekomendasi[r.kategori] || '')}</span></span>`;
    const hasil = r.hasil_akhir ? ' ' + pill(LABEL.hasil, r.hasil_akhir) : '';
    const sedia = r.kesediaan ? ' ' + pill(LABEL.kesediaan, r.kesediaan) : '';
    return `<div class="sel-seleksi">${seleksi}${hasil}${sedia}</div>${nilai}`;
  }

  function aksi(r) {
    if (r.status_admin === 'menunggu') return `<a class="link" href="admin_verifikasi.html?id=${r.id}">Verifikasi</a>`;
    if (r.status_admin === 'memenuhi' && !r.status_seleksi) return `<a class="link" href="admin_wawancara.html${r.batch_id ? '?batch=' + r.batch_id : ''}">Seleksi</a>`;
    if (r.status_seleksi === 'lolos' && !r.sudah_saya_nilai) return `<a class="link" href="admin_penilaian.html?id=${r.id}">Nilai</a>`;
    if (r.status_seleksi === 'lolos') return `<a class="link" href="admin_penilaian.html?id=${r.id}">Lihat</a>`;
    return `<a class="link" href="admin_verifikasi.html?id=${r.id}">Lihat</a>`;
  }

  function render() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const pt = document.getElementById('fPt').value;
    const batch = document.getElementById('fBatch').value;
    const status = document.getElementById('fStatus').value;
    const list = rows.filter(r =>
      (!q || [r.nama, r.nim, r.no_pendaftaran].join(' ').toLowerCase().includes(q)) &&
      (!pt || r.universitas === pt) &&
      (!batch || String(r.batch_id) === batch) &&
      (!status || (status === 'dinilai' ? r.nilai !== null : status === 'diterima' ? r.hasil_akhir === 'diterima'
        : status === 'lolos' || status === 'tidak_lolos' ? r.status_seleksi === status : r.status_admin === status))
    );
    if (urut.kunci) {
      list.sort((a, b) => {
        const x = nilaiUrut(a, urut.kunci), y = nilaiUrut(b, urut.kunci);
        if (x === null && y === null) return 0;
        if (x === null) return 1;
        if (y === null) return -1;
        return (x < y ? -1 : x > y ? 1 : 0) * urut.arah;
      });
    }
    const jumlahHalaman = Math.max(1, Math.ceil(list.length / PER_HALAMAN));
    halaman = Math.min(halaman, jumlahHalaman);
    const tampil = list.slice((halaman - 1) * PER_HALAMAN, halaman * PER_HALAMAN);
    renderHalaman(list.length);
    document.getElementById('rows').removeAttribute('aria-busy');
    document.getElementById('rows').innerHTML = tampil.length ? tampil.map(r => `
      <tr>
        <td class="name"><b>${esc(r.nama)}</b><span>${esc(r.no_pendaftaran)}</span></td>
        <td>${esc(r.universitas)}</td>
        <td>${esc(prodi(r.fakultas_prodi))} · ${esc(r.semester)}${r.jenjang !== 'S1' ? ` (${esc(r.jenjang)})` : ''}</td>
        <td>${esc(r.batch || '–')}</td>
        <td>${pill(LABEL.admin, r.status_admin)}</td>
        <td>${nilaiCell(r)}</td>
        <td>${aksi(r)}</td>
      </tr>`).join('') : `<tr><td colspan="7" class="empty">${rows.length ? 'Tidak ada pelamar yang cocok dengan filter.' : 'Belum ada pendaftaran yang masuk.'}</td></tr>`;
  }
</script>
</body>
</html>
